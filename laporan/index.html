<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased overflow-hidden h-screen flex flex-col">

    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <div class="flex-1 flex overflow-hidden w-full h-full relative">
        <aside class="hidden md:flex flex-col w-64 bg-emerald-900 text-emerald-100 shadow-xl z-20 shrink-0">
            <div class="h-16 flex items-center px-6 border-b border-emerald-800 bg-emerald-950">
                <i data-lucide="recycle" class="w-6 h-6 text-emerald-400 mr-2"></i>
                <span class="font-bold text-xl text-white tracking-wide">SI-PAS</span>
            </div>
            <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
                <a href="../jadwal_angkut/index.html" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all text-emerald-100 hover:bg-emerald-800 hover:text-white"><i data-lucide="calendar" class="w-5 h-5"></i> Jadwal Angkut</a>
                <a href="../iuran_warga/index.html" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all text-emerald-100 hover:bg-emerald-800 hover:text-white"><i data-lucide="credit-card" class="w-5 h-5"></i> Iuran Warga</a>
                <a href="../laporan/index.html" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all text-white bg-emerald-800 shadow-inner"><i data-lucide="alert-circle" class="w-5 h-5"></i> Laporan & Pengaduan</a>
                <a href="../edukasi/index.html" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all text-emerald-100 hover:bg-emerald-800 hover:text-white"><i data-lucide="book-open" class="w-5 h-5"></i> Edukasi</a>
                <a href="../dokumentasi/index.html" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all text-emerald-100 hover:bg-emerald-800 hover:text-white"><i data-lucide="camera" class="w-5 h-5"></i> Galeri Kegiatan</a>
            </nav>
        </aside>

        <div class="flex-1 flex flex-col h-full bg-slate-50 relative overflow-hidden">
            <header class="h-16 bg-white border-b border-slate-200 shadow-sm flex items-center justify-between px-4 sm:px-6 shrink-0 z-10">
                <div class="flex items-center gap-2 md:hidden">
                    <i data-lucide="recycle" class="w-6 h-6 text-emerald-600"></i>
                    <span class="font-bold text-lg text-emerald-900">SI-PAS</span>
                </div>
                <div class="hidden md:block">
                    <h2 class="font-bold text-slate-800 text-lg">Laporan & Pengaduan</h2>
                </div>

                <div class="flex items-center gap-4 ml-auto">
                    <div class="flex items-center gap-3 text-right">
                        <div class="hidden sm:block">
                            <p class="text-sm font-bold text-slate-800 leading-tight">Warga RT 01</p>
                            <p class="text-xs text-slate-500">Bpk. Ahmad</p>
                        </div>
                        <div class="w-10 h-10 rounded-full bg-emerald-100 border-2 border-emerald-500 flex items-center justify-center text-emerald-700 font-bold overflow-hidden">
                            <img src="https://placehold.co/100x100/059669/ffffff?text=WA" alt="Avatar" class="w-full h-full object-cover">
                        </div>
                    </div>
                    <div class="h-6 w-px bg-slate-200"></div>
                    <button onclick="handleLogout()" class="p-2 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition flex items-center gap-2" title="Keluar">
                        <i data-lucide="log-out" class="w-5 h-5"></i>
                        <span class="hidden sm:inline text-sm font-medium">Keluar</span>
                    </button>
                </div>
            </header>

            <main class="flex-1 overflow-y-auto p-4 sm:p-6 pb-24 md:pb-6 no-scrollbar">
                <section class="max-w-3xl mx-auto space-y-6"><div><h2 class="text-2xl font-bold text-slate-800">Laporan & Pengaduan</h2><p class="text-slate-500 text-sm mt-1">Sampaikan keluhan terkait pengangkutan sampah.</p></div><form id="form-laporan" onsubmit="submitReport(event)" class="bg-white p-6 md:p-8 rounded-3xl border border-slate-200 shadow-sm space-y-5"><div><label class="block text-sm font-semibold text-slate-700 mb-2">Kategori Laporan</label><select class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none text-sm bg-slate-50"><option>Sampah Belum Diangkut</option><option>Fasilitas Rusak</option><option>Lainnya</option></select></div><div><label class="block text-sm font-semibold text-slate-700 mb-2">Detail Kejadian / Lokasi</label><textarea rows="4" placeholder="Jelaskan detail laporan..." class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none text-sm bg-slate-50 resize-none" required></textarea></div><button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl shadow-md transition flex items-center justify-center gap-2"><i data-lucide="send" class="w-5 h-5"></i> Kirim Laporan</button></form></section>
            </main>
        </div>

        <nav class="md:hidden fixed bottom-0 left-0 w-full bg-white border-t border-slate-200 shadow-[0_-4px_15px_rgba(0,0,0,0.05)] z-40 pb-safe">
            <div class="flex justify-around items-center h-16 px-1">
                <a href="../jadwal_angkut/index.html" class="flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-emerald-600 transition gap-1"><i data-lucide="calendar" class="w-5 h-5"></i><span class="text-[9px] font-bold">Jadwal</span></a>
                <a href="../iuran_warga/index.html" class="flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-emerald-600 transition gap-1"><i data-lucide="credit-card" class="w-5 h-5"></i><span class="text-[9px] font-bold">Iuran</span></a>
                <a href="../laporan/index.html" class="flex flex-col items-center justify-center w-full h-full text-emerald-600 gap-1"><i data-lucide="alert-circle" class="w-5 h-5"></i><span class="text-[9px] font-bold">Laporan</span></a>
                <a href="../edukasi/index.html" class="flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-emerald-600 transition gap-1"><i data-lucide="book-open" class="w-5 h-5"></i><span class="text-[9px] font-bold">Edukasi</span></a>
                <a href="../dokumentasi/index.html" class="flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-emerald-600 transition gap-1"><i data-lucide="camera" class="w-5 h-5"></i><span class="text-[9px] font-bold">Galeri</span></a>
            </div>
        </nav>
    </div>
    
    <script src="../js/app.js"></script>
</body>
</html>
